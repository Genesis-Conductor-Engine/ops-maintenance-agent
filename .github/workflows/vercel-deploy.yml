# Reusable diamondnode CI/CD pattern for Vercel projects.
# Copy into each app repo or call via workflow_call after setting secrets.
#
# Required secrets/vars:
#   VERCEL_TOKEN
#   VERCEL_ORG_ID
#   VERCEL_PROJECT_ID
#
# Pattern: pull → build --prod → deploy --prebuilt (skill: deployments-cicd)

name: Deploy to Vercel (prebuilt)

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      target:
        description: "production or preview"
        required: true
        default: "preview"
        type: choice
        options: [preview, production]

concurrency:
  group: vercel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Vercel CLI (pinned)
        run: npm install -g vercel@48.12.1

      - name: Pull Vercel environment
        run: |
          ENV=preview
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            ENV=production
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV=${{ inputs.target }}
          fi
          echo "ENVIRONMENT=$ENV" >> "$GITHUB_ENV"
          vercel pull --yes --environment="$ENV" --token="$VERCEL_TOKEN"

      - name: Build
        run: |
          if [ "$ENVIRONMENT" = "production" ]; then
            vercel build --prod --token="$VERCEL_TOKEN"
          else
            vercel build --token="$VERCEL_TOKEN"
          fi

      - name: Deploy prebuilt
        id: deploy
        run: |
          if [ "$ENVIRONMENT" = "production" ]; then
            URL=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" --yes)
          else
            URL=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN" --yes)
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### Deploy Result" >> "$GITHUB_STEP_SUMMARY"
          echo "- **URL**: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Target**: $ENVIRONMENT" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit**: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment PR preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Preview deployment: ${url}`
            });
